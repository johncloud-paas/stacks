services:
  mcdb:
    image: postgres:17-alpine3.23
    user: "0:0"
    restart: unless-stopped
    command:
      - postgres
      - -c
      - jit=off
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - '${JOHNCLOUD_ROOT:?Missing JOHNCLOUD_ROOT}/${COMPOSE_PROJECT_NAME:?Missing COMPOSE_PROJECT_NAME}/db:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meteocomp']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}'
      POSTGRES_USER: 'meteocomp'
      POSTGRES_DB: meteocomp
  
  app:
    image: ghcr.io/umaneldi/meteocomp:latest
    restart: unless-stopped
    # Rootless Docker: container root maps to the host user, so data/ is owned by them.
    user: "0:0"
    depends_on:
      mcdb:
        condition: service_healthy
    environment:
    - OWM_API_KEY=${OWM_API_KEY:?Missing OWM_API_KEY}
    - WEATHER_API_KEY=${WEATHER_API_KEY:?Missing WEATHER_API_KEY}
    - INFOCLIMAT_API_KEY=${INFOCLIMAT_API_KEY:?Missing INFOCLIMAT_API_KEY}
    - METEOCOMP_HTTP_ADDR=:8080
    - DATABASE_URI=postgresql://meteocomp:${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}@mcdb:5432/meteocomp?sslmode=disable
    volumes:
      - $JOHNCLOUD_ROOT/$COMPOSE_PROJECT_NAME/data:/data/
    labels:
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.name=$COMPOSE_PROJECT_NAME
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.full-domain=$HOST
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.protocol=http
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.ssl=true
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].method=http
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].port=8080
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.auth.sso-enabled=true
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.auth.sso-roles[0]=Member
      - "homepage.group=$HOME_GROUP"
      - "homepage.name=$HOME_NAME"
      - "homepage.icon=$HOME_ICON"
      - "homepage.href=https://$HOST"
      - "homepage.description=$HOME_DESCRIPTION"

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
