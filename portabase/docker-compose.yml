services:
  dashboard:
    image: portabase/portabase:latest
    # user: "0:0"
    restart: unless-stopped
    volumes:
      - '${JOHNCLOUD_ROOT:?Missing JOHNCLOUD_ROOT}/${COMPOSE_PROJECT_NAME:?Missing COMPOSE_PROJECT_NAME}/dashboard:/data'
    environment:
      TZ: $TZ
      PROJECT_URL: https://$HOST
      PROJECT_SECRET: "${PROJECT_SECRET}"
    labels:
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.name=$COMPOSE_PROJECT_NAME
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.full-domain=$HOST
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.protocol=http
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.ssl=true
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].method=http
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].port=80
      # - pangolin.public-resources.$COMPOSE_PROJECT_NAME.auth.sso-enabled=true
      # - pangolin.public-resources.$COMPOSE_PROJECT_NAME.auth.sso-roles[0]=Member
      - "homepage.group=$HOME_GROUP"
      - "homepage.name=$HOME_NAME"
      - "homepage.icon=$HOME_ICON"
      - "homepage.href=https://$HOST"
      - "homepage.description=$HOME_DESCRIPTION"
  
  agent:
    image: portabase/agent:latest
    restart: unless-stopped
    volumes:
        # Montage du fichier de configuration des DBs (bases déclarées côté agent, optionnel)
        # - ./databases.toml:/config/config.toml
        - ${JOHNCLOUD_ROOT:?Missing JOHNCLOUD_ROOT}/${COMPOSE_PROJECT_NAME:?Missing COMPOSE_PROJECT_NAME}/agent/databases.json:/config/config.json
    environment:
        LOG: info
        # Enregistrer aussi les logs dans /var/log/app (voir Agent > Variables d'environnement > Logs)
        # LOG_TO_FILE: "true"
        # DATABASES_CONFIG_FILE: "config.toml"
        TZ: $TZ
        POLLING: 5
        APP_ENV: production
        EDGE_KEY: "${EDGE_KEY}"

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
