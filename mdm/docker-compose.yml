services:
  nanomdm:
    image: ghcr.io/micromdm/nanomdm:latest
    restart: unless-stopped
    volumes:
      - $JOHNCLOUD_ROOT/$COMPOSE_PROJECT_NAME/data:/app/data

  scep:
    image: ydethe/scep:latest
    restart: unless-stopped
    command: ["scepserver", "-allowrenew", "0", "-challenge", "nanomdm"]
    labels:
      - pangolin.proxy-resources.$COMPOSE_PROJECT_NAME.name=$COMPOSE_PROJECT_NAME
      - pangolin.proxy-resources.$COMPOSE_PROJECT_NAME.full-domain=$HOST
      - pangolin.proxy-resources.$COMPOSE_PROJECT_NAME.protocol=http
      - pangolin.proxy-resources.$COMPOSE_PROJECT_NAME.ssl=true
      - pangolin.proxy-resources.$COMPOSE_PROJECT_NAME.targets[0].method=http
      - pangolin.proxy-resources.$COMPOSE_PROJECT_NAME.targets[0].port=80
      - "homepage.group=$HOME_GROUP"
      - "homepage.name=$HOME_NAME"
      - "homepage.icon=$HOME_ICON"
      - "homepage.href=https://$HOST/"
      - "homepage.description=$HOME_DESCRIPTION"

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
    
