# This is the file for the **seed** node
# Use it only for the first node of your cluster, which will be used to bootstrap the other nodes.

services:
  webprogress:
    image: ghcr.io/ydethe/webprogress:latest
    # ports:
    #   - "8775:8775"
    restart: unless-stopped
    environment:
      # --- OIDC (required to start; server.run() validates these) ---
      WEBPROGRESS_OIDC_CLIENT_ID: "${WEBPROGRESS_OIDC_CLIENT_ID}"
      WEBPROGRESS_OIDC_CLIENT_SECRET: "${WEBPROGRESS_OIDC_CLIENT_SECRET}"
      WEBPROGRESS_OIDC_SERVER_METADATA_URL: "${WEBPROGRESS_OIDC_SERVER_METADATA_URL}"
      WEBPROGRESS_OIDC_SCOPE: ${WEBPROGRESS_OIDC_SCOPE}

      # --- Server ---
      # Public base URL of this server; used to build the /auth redirect URI.
      WEBPROGRESS_BASE_URL: "https://${HOST}"
      # Strong random value in production, e.g. `openssl rand -hex 32`.
      WEBPROGRESS_SESSION_SECRET: "${WEBPROGRESS_SESSION_SECRET:-change-me}"
      # SQLite path inside the container; kept on a volume for persistence.
      WEBPROGRESS_DB_PATH: "/data/webprogress.db"
    volumes:
      - "$JOHNCLOUD_ROOT/$COMPOSE_PROJECT_NAME/data:/data"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8775/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.name=$COMPOSE_PROJECT_NAME
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.full-domain=$HOST
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.protocol=http
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.ssl=true
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].method=http
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].port=8775
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].healthcheck.enabled=true
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].healthcheck.hostname=$COMPOSE_PROJECT_NAME-webprogress-1
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].healthcheck.port=8775
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].healthcheck.path=/health
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].healthcheck.method=GET
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].healthcheck.status=200

      # Page de maintenance en mode automatique
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.maintenance.enabled=true
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.maintenance.type=automatic
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.maintenance.title=Maintenance en cours
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.maintenance.message=Le service est temporairement indisponible.

      - "homepage.group=$HOME_GROUP"
      - "homepage.name=$HOME_NAME"
      - "homepage.icon=$HOME_ICON"
      - "homepage.href=https://${HOST}"
      - "homepage.description=$HOME_DESCRIPTION"

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
    
