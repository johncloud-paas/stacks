services:
  node:
    restart: unless-stopped
    image: ghcr.io/ydethe/revika-node:latest
    volumes:
      - $JOHNCLOUD_ROOT/$COMPOSE_PROJECT_NAME/data:/data
    ports:
      - "4001:4001"
    command:
      - -data=/data
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -repair=true
      - -repair-interval=${REPAIR_INTERVAL:-1h}
      - -pow-difficulty=$POW_DIFFICULTY
      - -pow-puzzle=argon2id
      - -public-ip=$PUBLIC_IP
      - -advertise=true
      - -capacity=$CAPACITY
      - -log-format=json
      - -log-level=$LOGLEVEL
      - -metrics=:9096
      - -quota=$STORAGE_QUOTA
      - -rebalance=true
      - -rebalance-interval=$REBALANCE_INTERVAL
      - -rebalance-threshold=0.1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9096/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

