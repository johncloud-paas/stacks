services:
  douceville:
    image: ghcr.io/umaneldi/douceville:latest
    restart: unless-stopped
    depends_on:
      geodb:
        condition: service_healthy
    environment:
      POSTGRES_HOST: geodb
      POSTGRES_PORT: 5432
      POSTGRES_DB: douceville
      POSTGRES_USER: douceville
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      JWT_SECRET: $JWT_SECRET
      OPENROUTESERVICE_KEY: $OPENROUTESERVICE_KEY
      ADDOK_HOST: ${ADDOK_HOST:-}
      LOGLEVEL: ${LOGLEVEL:-INFO}
      PUBLIC_URL: https://${HOST}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    labels:
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.name=$COMPOSE_PROJECT_NAME
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.full-domain=$HOST
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.protocol=http
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.ssl=true
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].method=http
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].port=3566
      - "homepage.group=$HOME_GROUP"
      - "homepage.name=$HOME_NAME"
      - "homepage.icon=$HOME_ICON"
      - "homepage.href=https://${HOST}"
      - "homepage.description=$HOME_DESCRIPTION"

  geodb:
    image: postgis/postgis:18-3.7
    restart: unless-stopped
    user: "0:0"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U douceville']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - '${JOHNCLOUD_ROOT:?Missing JOHNCLOUD_ROOT}/${COMPOSE_PROJECT_NAME:?Missing COMPOSE_PROJECT_NAME}/db:/var/lib/postgresql'
    environment:
      POSTGRES_DB: douceville
      POSTGRES_USER: douceville
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD

