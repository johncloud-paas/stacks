services:
  app:
    image: ghcr.io/umaneldi/douceville:latest
    restart: unless-stopped
    depends_on:
      geodb:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    environment:
      POSTGRES_HOST: geodb
      POSTGRES_PORT: 5432
      POSTGRES_DB: douceville
      POSTGRES_USER: douceville
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      JWT_SECRET: $JWT_SECRET
      OPENROUTESERVICE_KEY: ${OPENROUTESERVICE_KEY:-}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-valhalla}
      VALHALLA_URL: http://valhalla:8002
      VALHALLA_CONCURRENCY: ${VALHALLA_CONCURRENCY:-8}
      ADDOK_HOST: ${ADDOK_HOST:-}
      LOGLEVEL: ${LOGLEVEL:-INFO}
      PUBLIC_URL: https://${HOST}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      OIDC_SCOPES: ${OIDC_SCOPES:-"openid email profile"}
      OIDC_DEFAULT_PERMS: ${OIDC_DEFAULT_PERMS:-verified}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      MOLLIE_WEBHOOK_URL: https://${HOST:-}/api/billing/webhook/mollie
    labels:
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.name=$COMPOSE_PROJECT_NAME
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.full-domain=$HOST
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.protocol=http
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.ssl=true
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].method=http
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].port=3566
      - "homepage.group=$HOME_GROUP"
      - "homepage.name=$HOME_NAME"
      - "homepage.icon=$HOME_ICON"
      - "homepage.href=https://${HOST}"
      - "homepage.description=$HOME_DESCRIPTION"

  geodb:
    image: postgis/postgis:18-3.7
    restart: unless-stopped
    user: "0:0"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U douceville']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - '${JOHNCLOUD_ROOT:?Missing JOHNCLOUD_ROOT}/${COMPOSE_PROJECT_NAME:?Missing COMPOSE_PROJECT_NAME}/db:/var/lib/postgresql'
    environment:
      POSTGRES_DB: douceville
      POSTGRES_USER: douceville
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD

  # Valhalla (ROUTING_PROVIDER=valhalla) : lit les tuiles à la demande sur un
  # stockage S3 compatible (VALHALLA_TILE_URL, terminée par /{tilePath}) et les
  # garde dans ./.valhalla/tiles. La carte de connectivité est désactivée :
  # Valhalla la construit au démarrage à partir des seules tuiles locales
  # (aucune ici au départ) et rejetterait alors tous les itinéraires
  # (« unconnected regions »). Aucune construction de tuiles ici : elles
  # sont produites et déposées par scripts/build_valhalla_tiles.sh, sur une
  # machine de build. Démarrage : docker compose --profile valhalla up -d
  valhalla:
    image: ${VALHALLA_IMAGE:-ghcr.io/valhalla/valhalla:3.9.3}
    restart: unless-stopped
    volumes:
      - ${JOHNCLOUD_ROOT:?Missing JOHNCLOUD_ROOT}/${COMPOSE_PROJECT_NAME:?Missing COMPOSE_PROJECT_NAME}/valhalla:/data
    environment:
      VALHALLA_TILE_URL: ${VALHALLA_TILE_URL:-}
      VALHALLA_CACHE_BYTES: ${VALHALLA_CACHE_BYTES:-300000000}
      VALHALLA_THREADS: ${VALHALLA_THREADS:-4}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:8002/status']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command:
      - bash
      - -euc
      - |
        : "$${VALHALLA_TILE_URL:?VALHALLA_TILE_URL is required (public S3 URL ending with /{tilePath})}"
        mkdir -p /data/tiles
        auth=()
        valhalla_build_config \
          --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract '' --mjolnir-traffic-extract '' \
          --mjolnir-tile-url "$$VALHALLA_TILE_URL" "$${auth[@]}" \
          --mjolnir-use-lru-mem-cache True --mjolnir-max-cache-size "$$VALHALLA_CACHE_BYTES" \
          --mjolnir-admin '' --mjolnir-timezone '' \
          --loki-use-connectivity False \
          --service-limits-isochrone-max-contours 12 --service-limits-isochrone-max-time-contour 120 \
          > /data/valhalla.json
        exec valhalla_service /data/valhalla.json "$$VALHALLA_THREADS"

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
