services:
  mailserver:
    # swaks --to test-xxxxxxx@srv1.mail-tester.com --from admin@$HOST --server $HOST --auth-user admin --protocol SSMTP --port 465 --auth-password xxx
    image: stalwartlabs/stalwart:v0.16
    restart: unless-stopped
    hostname: $SERVER_SUBDOMAIN.$HOST
    ports:
      - '25:25'
      - '587:587'
      - '465:465'
      - '143:143'
      - '993:993'
      - '4190:4190'
      - '110:110'
      - '995:995'
    environment:
      DISABLE_CLAMAV: $DISABLE_CLAMAV
      DISABLE_RSPAMD: $DISABLE_RSPAMD
      DISABLE_ROUNDCUBE: $DISABLE_ROUNDCUBE
      STALWART_PUBLIC_URL: https://$SERVER_SUBDOMAIN.$HOST
      # STALWART_RECOVERY_MODE: 1
      # STALWART_RECOVERY_ADMIN: admin:yourpassword
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $JOHNCLOUD_ROOT/${COMPOSE_PROJECT_NAME}/data:/var/lib/stalwart
      - $JOHNCLOUD_ROOT/${COMPOSE_PROJECT_NAME}/logs:/var/log/stalwart
      - $JOHNCLOUD_ROOT/${COMPOSE_PROJECT_NAME}/etc:/etc/stalwart
    labels:
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.name=${COMPOSE_PROJECT_NAME}
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.full-domain=$SERVER_SUBDOMAIN.$HOST
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.protocol=http
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.ssl=true
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].method=http
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].port=8080

      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].healthcheck.enabled=true
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].healthcheck.hostname=${COMPOSE_PROJECT_NAME}-mailserver-1
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].healthcheck.port=8080
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].healthcheck.path=/healthz/live
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].healthcheck.method=GET
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].healthcheck.status=200

      # Page de maintenance en mode automatique
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.maintenance.enabled=true
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.maintenance.type=automatic
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.maintenance.title=Maintenance en cours
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.maintenance.message=Le service est temporairement indisponible.

      - homepage.group=$HOME_GROUP
      - homepage.name=$HOME_NAME
      - homepage.icon=$HOME_ICON
      - homepage.href=https://$SERVER_SUBDOMAIN.$HOST
      - homepage.description=$HOME_DESCRIPTION

  webmail:
    image: ghcr.io/bulwarkmail/webmail:latest
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0" # Use "::" for IPv6
      PORT: "3000"
      # Stalwart's public HTTPS address. Browsers talk JMAP to it directly.
      JMAP_SERVER_URL: https://$WEBMAIL_SUBDOMAIN.$HOST
    depends_on:
      - mailserver
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.name=${COMPOSE_PROJECT_NAME}_webmail
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.full-domain=$WEBMAIL_SUBDOMAIN.$HOST
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.protocol=http
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.ssl=true
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.targets[0].method=http
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.targets[0].port=3000

      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.targets[0].healthcheck.enabled=true
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.targets[0].healthcheck.hostname=${COMPOSE_PROJECT_NAME}-webmail-1
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.targets[0].healthcheck.port=3000
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.targets[0].healthcheck.path=/api/health
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.targets[0].healthcheck.method=GET
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.targets[0].healthcheck.status=200

      # Page de maintenance en mode automatique
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.maintenance.enabled=true
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.maintenance.type=automatic
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.maintenance.title=Maintenance en cours
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}_wm.maintenance.message=Le service est temporairement indisponible.

      - homepage.group=$HOME_GROUP
      - homepage.name=Bulwark
      - homepage.icon=$HOME_ICON
      - homepage.href=https://$WEBMAIL_SUBDOMAIN.$HOST
      - homepage.description=$HOME_DESCRIPTION

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
    