services:
  sshd:
    image: debian:12-slim
    command: ["/bin/sh", "/scripts/setup-sshd.sh"]
    restart: unless-stopped
    environment:
      SSH_USER: $SSH_USER
      REMOTE_USER_EMAIL: $REMOTE_USER_EMAIL
      OIDC_ISSUER: $OIDC_ISSUER
      CLIENT_ID: $CLIENT_ID
      KEY_EXPIRATION: $KEY_EXPIRATION
    ports:
      - "$EXPOSED_PORT:22"
    volumes:
      - ./scripts:/scripts:ro
      - $JOHNCLOUD_ROOT/$COMPOSE_PROJECT_NAME/etc:/etc/ssh

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
