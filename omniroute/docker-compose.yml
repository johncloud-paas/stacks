services:
  redis:
    image: docker.io/library/redis:8.6.5-alpine
    restart: unless-stopped
    volumes:
      - $JOHNCLOUD_ROOT/${COMPOSE_PROJECT_NAME}/redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - DASHBOARD_PORT=20128
      - API_PORT=20129
      - LIVE_WS_PORT=20132
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379
      - APP_BIND_HOST=127.0.0.1
      - REQUIRE_API_KEY=false
      - OMNIROUTE_MEMORY_MB=2048
      - NEXT_PUBLIC_BASE_URL=https://$HOST
      - BASE_URL=http://omniroute:20128
    ports:
      # Loopback-only by default. Override APP_BIND_HOST in .env to expose.
      - "${APP_BIND_HOST:-127.0.0.1}:${DASHBOARD_PORT:-20128}:${DASHBOARD_PORT:-20128}"
      - "${APP_BIND_HOST:-127.0.0.1}:${API_PORT:-20129}:${API_PORT:-20129}"
      - "${APP_BIND_HOST:-127.0.0.1}:${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}"
    volumes:
      - $JOHNCLOUD_ROOT/${COMPOSE_PROJECT_NAME}/data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.name=${COMPOSE_PROJECT_NAME}
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.full-domain=$HOST
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.protocol=http
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.ssl=true
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].method=http
      - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].port=20128

      # - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].healthcheck.enabled=true
      # - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].healthcheck.hostname=${COMPOSE_PROJECT_NAME}-omniroute-1
      # - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].healthcheck.port=20128
      # - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].healthcheck.path=/healthz/live
      # - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].healthcheck.method=GET
      # - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.targets[0].healthcheck.status=200

      # # Page de maintenance en mode automatique
      # - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.maintenance.enabled=true
      # - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.maintenance.type=automatic
      # - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.maintenance.title=Maintenance en cours
      # - pangolin.public-resources.${COMPOSE_PROJECT_NAME}.maintenance.message=Le service est temporairement indisponible.

      - homepage.group=$HOME_GROUP
      - homepage.name=$HOME_NAME
      - homepage.icon=$HOME_ICON
      - homepage.href=https://$HOST
      - homepage.description=$HOME_DESCRIPTION

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
    