services:
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: capella-for-syson-db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d capella-for-syson-db"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - $JOHNCLOUD_ROOT/$COMPOSE_PROJECT_NAME/db:/var/lib/postgresql/data

  app:
    image: '${IMAGE_TAG:-eclipsecapella/capella-for-syson:v2026.9.0}'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database/capella-for-syson-db
      SPRING_DATASOURCE_USERNAME: dbuser
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: "*"
      SERVER_PORT: 8080
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: false
    healthcheck:
      test: "wget --quiet --spider http://localhost:8080/actuator/health || exit 1"
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      database:
        condition: service_healthy
    labels:
      - pangolin.proxy-resources.$COMPOSE_PROJECT_NAME.name=$COMPOSE_PROJECT_NAME
      - pangolin.proxy-resources.$COMPOSE_PROJECT_NAME.full-domain=$HOST
      - pangolin.proxy-resources.$COMPOSE_PROJECT_NAME.protocol=http
      - pangolin.proxy-resources.$COMPOSE_PROJECT_NAME.ssl=true
      - pangolin.proxy-resources.$COMPOSE_PROJECT_NAME.auth.sso-enabled=true
      - pangolin.proxy-resources.$COMPOSE_PROJECT_NAME.auth.sso-roles[0]=Member
      - pangolin.proxy-resources.$COMPOSE_PROJECT_NAME.targets[0].method=http
      - pangolin.proxy-resources.$COMPOSE_PROJECT_NAME.targets[0].port=8080
      
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].healthcheck.enabled=true
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].healthcheck.hostname=$COMPOSE_PROJECT_NAME-app-1
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].healthcheck.port=8080
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].healthcheck.path=/actuator/health
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].healthcheck.method=GET
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.targets[0].healthcheck.status=200

      # Page de maintenance en mode automatique
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.maintenance.enabled=true
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.maintenance.type=automatic
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.maintenance.title=Maintenance en cours
      - pangolin.public-resources.$COMPOSE_PROJECT_NAME.maintenance.message=Le service est temporairement indisponible.
      
      - "homepage.group=$HOME_GROUP"
      - "homepage.name=$HOME_NAME"
      - "homepage.icon=$HOME_ICON"
      - "homepage.href=https://$HOST/"
      - "homepage.description=$HOME_DESCRIPTION"

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
